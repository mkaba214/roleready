name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runner, actions and Floci are pinned so CI behaves the same until the Nov 28 deadline.
# ubuntu-latest moves to Ubuntu 26 and the v4/v5 actions run on the retired Node 20.

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: IAM least-privilege lint
        run: python scripts/iam.py lint
      - run: pytest

  # Applies infra/iam/iam.yaml to Floci with IAM enforcement on, then proves who can and cannot
  # reach each secret. A failure here turns the PR red (no continue-on-error since #2 was fixed).
  iam-floci:
    runs-on: ubuntu-24.04
    services:
      floci:
        image: floci/floci-gcp:0.12.0 # same image that :latest pointed to on Nov 10; keep in step with docker-compose.yml
        ports:
          - 4588:4588
        env:
          FLOCI_GCP_SERVICES_IAM_AUTHORIZATION_MODE: enforce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Wait for Floci
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4588/ && break; sleep 1; done
      - name: IAM enforcement tests
        env:
          FLOCI_GCP_URL: http://localhost:4588
        run: pytest tests/iam -v

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose
